[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dacwatch"
version = "0.1.0"
description = "DaCWatch - Diagram as Code File Watcher"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "pyside6>=6.9.2",
    "pytest>=8.4.1",
    "qasync>=0.28.0",
    "typer>=0.17.3",
    "watchdog>=6.0.0",
]

[project.scripts]
dacwatch = "dacwatch.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
qt_api = "pyside6"
addopts = "-v"
testpaths = ["tests"]
